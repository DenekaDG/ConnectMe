<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denys Lite Call Ultimate</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; color: white; }
        #remote-video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; background: #1a1a1a; }
        #local-video { position: absolute; top: 20px; right: 20px; width: 100px; height: 140px; object-fit: cover; border-radius: 15px; border: 2px solid rgba(255,255,255,0.4); z-index: 10; transform: scaleX(-1); }
        .ui-overlay { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 20; gap: 20px; }
        .controls-row { display: flex; gap: 10px; }
        .btn { width: 55px; height: 55px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: 0.2s; }
        .btn-call { background: #28a745; color: white; width: auto; border-radius: 30px; padding: 0 30px; font-size: 18px; font-weight: bold; }
        .btn-hangup { background: #eb4034; color: white; }
        .btn-action { background: rgba(255,255,255,0.2); color: white; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        #chat-window { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 250px; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; display: none; flex-direction: column; border: 1px solid rgba(255,255,255,0.2); z-index: 30; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 12px; max-width: 80%; width: fit-content; font-size: 14px; color: white; }
        .msg.me { align-self: flex-end; background: #28a745; }
        #chat-input-area { display: flex; padding: 10px; gap: 5px; }
        #chat-input { flex: 1; background: rgba(255,255,255,0.15); border: none; border-radius: 10px; color: white; padding: 10px; outline: none; }
        input#room-input { background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 15px; border-radius: 15px; text-align: center; width: 80%; font-size: 16px; }
    </style>
</head>
<body>

    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay muted playsinline></video>

    <div id="chat-window">
        <div id="messages"></div>
        <form id="chat-form" onsubmit="sendMessage(event)" style="display:contents;">
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Сообщение..." autocomplete="off">
                <button type="submit" style="background: #28a745; border: none; color: white; border-radius: 10px; padding: 5px 15px; cursor: pointer;">></button>
            </div>
        </form>
    </div>

    <div class="ui-overlay" id="ui-setup">
        <input type="text" id="room-input" placeholder="Имя комнаты">
        <button class="btn btn-call" onclick="joinRoom()">СОЗДАТЬ / ВОЙТИ</button>
    </div>

    <div class="ui-overlay" id="ui-active" style="display: none;">
        <div class="controls-row">
            <button class="btn btn-action" onclick="toggleChat()">💬</button>
            <button class="btn btn-action" onclick="switchCamera()">🔄</button>
            <button class="btn btn-action" onclick="shareLink()">🔗</button>
            <button class="btn btn-action" onclick="toggleAudio()" id="mute-btn">🎤</button>
            <button class="btn btn-hangup" onclick="location.reload()">📞</button>
        </div>
    </div>

    <script>
        const remoteVideo = document.getElementById('remote-video');
        const localVideo = document.getElementById('local-video');
        const messagesDiv = document.getElementById('messages');
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        let localStream, peer, dataConn;
        let currentFacingMode = 'user';

        async function initCamera(mode) {
            try {
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: true });
                localVideo.srcObject = localStream;
                localVideo.style.transform = (mode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
            } catch (e) { alert("Ошибка камеры: " + e); }
        }

        initCamera(currentFacingMode).then(() => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('room')) {
                document.getElementById('room-input').value = params.get('room');
                setTimeout(joinRoom, 1000);
            }
        });

        function joinRoom() {
            const room = document.getElementById('room-input').value;
            if (!room) return;
            document.getElementById('ui-setup').style.display = 'none';
            document.getElementById('ui-active').style.display = 'flex';

            const fullId = 'den-room-' + room;
            peer = new Peer();

            peer.on('open', () => {
                const call = peer.call(fullId, localStream);
                call.on('stream', s => { remoteVideo.srcObject = s; });

                const conn = peer.connect(fullId);
                conn.on('open', () => { dataConn = conn; setupChat(conn); });

                const hostPeer = new Peer(fullId);
                hostPeer.on('call', c => {
                    c.answer(localStream);
                    c.on('stream', s => { remoteVideo.srcObject = s; });
                });
                hostPeer.on('connection', c => {
                    dataConn = c;
                    setupChat(c);
                });
            });
        }

        function shareLink() {
            const room = document.getElementById('room-input').value;
            const url = window.location.origin + window.location.pathname + "?room=" + room;
            navigator.clipboard.writeText(url).then(() => {
                alert("Ссылка на комнату скопирована!");
            });
        }

        function setupChat(conn) {
            conn.on('data', data => addMessage(data, 'other'));
        }

        function sendMessage(e) {
            if (e) e.preventDefault();
            const text = chatInput.value;
            if (text && dataConn) {
                dataConn.send(text);
                addMessage(text, 'me');
                chatInput.value = '';
            }
        }

        function addMessage(text, side) {
            const m = document.createElement('div');
            m.className = 'msg ' + side;
            m.innerText = text;
            messagesDiv.appendChild(m);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function toggleChat() { chatWindow.style.display = (chatWindow.style.display === 'flex') ? 'none' : 'flex'; }
        
        async function switchCamera() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            await initCamera(currentFacingMode);
        }

        function toggleAudio() {
            const t = localStream.getAudioTracks()[0];
            t.enabled = !t.enabled;
            document.getElementById('mute-btn').innerText = t.enabled ? "🎤" : "🔇";
        }
    </script>
</body>
</html>
