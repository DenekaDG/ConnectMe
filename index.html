<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denys Lite Call</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; color: white; }
        
        /* Видео собеседника на весь экран */
        #remote-video {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover; background: #1a1a1a;
        }

        /* Твое видео — маленькое в углу */
        #local-video {
            position: absolute; top: 20px; right: 20px;
            width: 100px; height: 140px;
            object-fit: cover; border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 10; transform: scaleX(-1); /* Зеркально для удобства */
        }

        /* Оверлей с кнопками и вводом */
        .ui-overlay {
            position: absolute; bottom: 40px; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            z-index: 20; gap: 20px;
        }

        .controls-row { display: flex; gap: 15px; }

        .btn {
            width: 60px; height: 60px; border-radius: 50%;
            border: none; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 24px;
            transition: 0.3s;
        }

        .btn-call { background: #28a745; color: white; width: auto; border-radius: 30px; padding: 0 30px; font-size: 18px; }
        .btn-hangup { background: #dc3545; color: white; }
        .btn-action { background: rgba(255,255,255,0.2); color: white; backdrop-filter: blur(10px); }

        input {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 15px; border-radius: 10px; text-align: center;
            width: 70%; max-width: 300px; font-size: 16px; outline: none;
        }

        #status { font-size: 14px; color: #aaa; margin-bottom: 5px; }
    </style>
</head>
<body>

    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay muted playsinline></video>

    <div class="ui-overlay" id="ui-setup">
        <div id="status">Готов к работе</div>
        <input type="text" id="room-input" placeholder="Введите имя комнаты">
        <button class="btn btn-call" onclick="joinRoom()">Войти и начать</button>
    </div>

    <div class="ui-overlay" id="ui-active" style="display: none;">
        <div class="controls-row">
            <button class="btn btn-action" onclick="toggleAudio()" id="mute-btn">🎤</button>
            <button class="btn btn-action" onclick="shareLink()">🔗</button>
            <button class="btn btn-hangup" onclick="location.reload()">📞</button>
        </div>
    </div>

    <script>
        const remoteVideo = document.getElementById('remote-video');
        const localVideo = document.getElementById('local-video');
        const statusDiv = document.getElementById('status');
        let localStream;
        let peer;

        // 1. Инициализация камеры
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                checkUrlParams(); // Проверяем ссылку после готовности камеры
            })
            .catch(err => {
                statusDiv.innerText = "Ошибка камеры: " + err.message;
            });

        // 2. Логика входа в комнату
        function joinRoom() {
            const room = document.getElementById('room-input').value;
            if (!room) return alert("Введите название комнаты!");

            document.getElementById('ui-setup').style.display = 'none';
            document.getElementById('ui-active').style.display = 'flex';

            const fullId = 'den-room-' + room;
            peer = new Peer();

            peer.on('open', (myId) => {
                console.log("Мой ID: " + myId);
                
                // Пытаемся позвонить на ID комнаты (если там уже кто-то есть)
                const call = peer.call(fullId, localStream);
                call.on('stream', stream => { remoteVideo.srcObject = stream; });

                // Сами становимся "слушателем" для этой комнаты
                const hostPeer = new Peer(fullId);
                hostPeer.on('call', (incomingCall) => {
                    incomingCall.answer(localStream);
                    incomingCall.on('stream', stream => { remoteVideo.srcObject = stream; });
                });
            });
        }

        // 3. Авто-вход по ссылке ?room=название
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const roomName = params.get('room');
            if (roomName) {
                document.getElementById('room-input').value = roomName;
                setTimeout(joinRoom, 500);
            }
        }

        // 4. Копирование ссылки
        function shareLink() {
            const room = document.getElementById('room-input').value;
            const url = window.location.origin + window.location.pathname + "?room=" + room;
            navigator.clipboard.writeText(url).then(() => {
                alert("Ссылка скопирована! Отправь её собеседнику.");
            });
        }

        // 5. Выключение микрофона
        function toggleAudio() {
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            document.getElementById('mute-btn').innerText = audioTrack.enabled ? "🎤" : "🔇";
        }
    </script>
</body>
</html>
