<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lite Skype - Denys</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #121212; font-family: -apple-system, sans-serif; color: white; overflow: hidden; }
        
        /* Видео */
        #remote-video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; background: #000; }
        #local-video { position: absolute; top: 20px; right: 20px; width: 100px; height: 140px; object-fit: cover; border-radius: 15px; border: 2px solid #3498db; z-index: 10; transform: scaleX(-1); }

        /* Главное меню */
        #main-menu { position: absolute; inset: 0; background: #121212; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .contact-list { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        .contact-card { background: #1e1e1e; padding: 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; transition: 0.3s; }
        .contact-card:active { transform: scale(0.95); background: #252525; }
        .contact-info b { font-size: 18px; display: block; }
        .contact-info span { font-size: 13px; color: #888; }
        .call-btn-icon { background: #28a745; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* Оверлей управления во время звонка */
        .ui-overlay { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 20; gap: 20px; }
        .controls-row { display: flex; gap: 15px; }
        .btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .btn-hangup { background: #eb4034; color: white; }
        .btn-action { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.2); }

        h1 { margin: 0; font-size: 28px; font-weight: 800; }
        .my-id-tag { background: #3498db; padding: 5px 15px; border-radius: 20px; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay muted playsinline></video>

    <div id="main-menu">
        <h1>Lite Skype</h1>
        <div class="my-id-tag">Ваш профиль: <b>Денис</b></div>
        
        <div class="contact-list">
            <div class="contact-card" onclick="startCall('den-room-friend1')">
                <div class="contact-info">
                    <b>Александр</b>
                    <span>Нажми, чтобы позвонить</span>
                </div>
                <div class="call-btn-icon">📞</div>
            </div>

            <div class="contact-card" onclick="startCall('den-room-friend2')">
                <div class="contact-info">
                    <b>Мария</b>
                    <span>Нажми, чтобы позвонить</span>
                </div>
                <div class="call-btn-icon">📞</div>
            </div>

            <div class="contact-card" onclick="startCall('den-room-custom')">
                <div class="contact-info">
                    <b>Общая комната</b>
                    <span>Для всех остальных</span>
                </div>
                <div class="call-btn-icon">👥</div>
            </div>
        </div>
    </div>

    <div class="ui-overlay" id="ui-active" style="display: none;">
        <div class="controls-row">
            <button class="btn btn-action" onclick="switchCamera()">🔄</button>
            <button class="btn btn-action" onclick="copyCallLink()">🔗</button>
            <button class="btn btn-hangup" onclick="location.reload()">📞</button>
        </div>
    </div>

    <script>
        const remoteVideo = document.getElementById('remote-video');
        const localVideo = document.getElementById('local-video');
        let localStream, peer, currentRoomId;

        // Инициализация камеры
        async function initCamera() {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
        }

        initCamera();

        // Проверка авто-входа по ссылке
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('room')) startCall(params.get('room'));
        };

        function startCall(roomId) {
            currentRoomId = roomId;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('ui-active').style.display = 'flex';

            peer = new Peer();
            peer.on('open', () => {
                // Звоним
                const call = peer.call(roomId, localStream);
                call.on('stream', s => remoteVideo.srcObject = s);

                // Слушаем входящий
                const hostPeer = new Peer(roomId);
                hostPeer.on('call', c => {
                    c.answer(localStream);
                    c.on('stream', s => remoteVideo.srcObject = s);
                });
            });
        }

        function copyCallLink() {
            const url = window.location.origin + window.location.pathname + "?room=" + currentRoomId;
            navigator.clipboard.writeText(url).then(() => alert("Ссылка скопирована! Отправь её другу в Telegram."));
        }

        async function switchCamera() {
            const mode = localVideo.style.transform === 'scaleX(-1)' ? 'environment' : 'user';
            localStream.getTracks().forEach(t => t.stop());
            localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: true });
            localVideo.srcObject = localStream;
            localVideo.style.transform = (mode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
        }
    </script>
</body>
</html>
